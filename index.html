<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Redes | Sofía Salazar</title>

    <!-- Logos de Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 15%, #ffffffaa, transparent 25%),
                radial-gradient(circle at 85% 80%, #ffffff88, transparent 25%),
                linear-gradient(135deg, #ffd1e8, #e9c1ff, #cfc4ff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;

            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(15px);

            border-radius: 30px;
            padding: 35px 25px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(120, 50, 110, 0.25);
        }

        .foto {
            width: 145px;
            height: 145px;

            object-fit: cover;

            border-radius: 50%;

            border: 6px solid white;

            box-shadow: 0 10px 30px rgba(130, 50, 110, 0.25);
        }

        h1 {
            margin: 18px 0 5px;

            color: #542343;

            font-size: 32px;
        }

        .nombre {
            color: #87546f;
            font-size: 17px;

            margin-bottom: 28px;
        }

        .red {
            display: flex;
            align-items: center;

            width: 100%;
            height: 65px;

            margin: 14px 0;

            padding: 0 20px;

            border-radius: 20px;

            text-decoration: none;

            color: #542343;

            background: white;

            box-shadow: 0 8px 20px rgba(120, 50, 100, 0.12);

            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;
        }

        .red:hover {
            transform: translateY(-4px);

            box-shadow:
                0 13px 25px rgba(120, 50, 100, 0.20);
        }
